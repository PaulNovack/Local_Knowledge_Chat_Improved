<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapQuest Driving Directions</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { color-scheme: light; font: 15px/1.4 system-ui, sans-serif; color: #18211f; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    .route-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; width: 100%; height: 100%; }
    #map-panel { position: relative; min-width: 0; min-height: 0; }
    #map { width: 100%; height: 100%; background: #e9efed; }
    #status { position: absolute; z-index: 1000; top: 12px; left: 12px; max-width: calc(100% - 24px); padding: 10px 12px; background: #fff; box-shadow: 0 1px 6px #0003; }
    #status[hidden] { display: none; }
    #directions { display: flex; min-height: 0; flex-direction: column; border-left: 1px solid #d5ddda; background: #fff; }
    #directions header { padding: 16px; border-bottom: 1px solid #d5ddda; }
    .direction-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #directions h1 { margin: 0 0 4px; font-size: 18px; }
    #summary { color: #56635f; }
    #play-directions { flex: 0 0 auto; border: 0; border-radius: 4px; padding: 9px 12px; background: #176e62; color: #fff; font: inherit; }
    #play-directions:disabled { opacity: 0.55; }
    #maneuvers { overflow: auto; margin: 0; padding: 0; list-style: none; }
    #maneuvers li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e5e9e7; }
    .step-number { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 50%; background: #e2f1ed; color: #176e62; font-size: 13px; font-weight: 700; }
    .step-copy p { margin: 0; }
    .step-copy small { display: block; margin-top: 4px; color: #66716e; }
    @media (max-width: 700px) {
      .route-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(200px, 42dvh) minmax(0, 1fr); }
      #directions { border-top: 1px solid #d5ddda; border-left: 0; }
      #directions header { padding: 10px 14px; }
      #directions h1 { font-size: 16px; }
      #play-directions { padding: 8px 10px; font-size: 14px; }
      #maneuvers li { padding: 11px 14px; }
    }
  </style>
</head>
<body>
  <main class="route-layout">
    <section id="map-panel" aria-label="Route map">
      <div id="map"></div>
      <div id="status" role="status">Loading route…</div>
    </section>
    <aside id="directions" aria-label="Turn-by-turn directions">
      <header>
        <div class="direction-tools">
          <div>
            <h1>Driving directions</h1>
            <div id="summary" aria-live="polite">Calculating route…</div>
          </div>
          <button id="play-directions" type="button" disabled>Play first 2 turns</button>
        </div>
      </header>
      <ol id="maneuvers"></ol>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://unpkg.com/leaflet-rotate@0.5.0/dist/leaflet-rotate.js" defer></script>
  <script src="/mapquest-directions.js?v=20261028-heading-up" defer></script>
</body>
</html>
