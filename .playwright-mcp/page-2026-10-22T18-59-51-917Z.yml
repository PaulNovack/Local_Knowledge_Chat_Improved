        - heading "What is step 10 of the pre-trip inspection?" [level=2] [ref=f11e124]
        - paragraph [ref=f11e125]: "All items listed in the pre-trip inspection procedure. The pre-trip inspection includes these items, as applicable to your vehicle: 1. Previous inspection report: Review reported defects and confirm necessary repairs. 2. General vehicle condition: Look for damage, leaning, leaks, and hazards beneath or around the vehicle. 3. Engine compartment: Check fluid levels, belts, hoses, wiring, and leaks. 4. Steering system: Check the gearbox, hoses, linkage, mounts, and steering-wheel play. 5. Suspension: Inspect springs, hangers, shackles, U-bolts, shocks, and air bags. 6. Brakes: Inspect lines, hoses, chambers, slack adjusters, drums or rotors, and linings or pads. 7. Tires: Check inflation, tread depth, damage, and dual-tire spacing. 8. Wheels and rims: Check rims, lug nuts, studs, hubs, and axle seals. 9. Cab entry: Check doors, steps, and handholds. 10. Seat belt: Check condition, secure mounting, and proper operation. 11. Windshield and mirrors: Check cleanliness, damage, visibility, and adjustment. 12. Cab controls: Check steering, clutch, accelerator, transmission, brake controls, and other equipped controls. 13. Gauges and warning devices: Check oil pressure, coolant temperature, charging system, air pressure, and warning indicators. 14. Horn, wipers, washers, heater, and defroster: Check operation. 15. Lights and reflectors: Check headlights, signals, flashers, brake lights, taillights, marker lights, and reflectors. 16. Emergency equipment: Check the fire extinguisher, three warning triangles, and spare fuses unless equipped with circuit breakers. 17. Fuel system: Check tanks, caps, straps, lines, and leaks. 18. Battery: Check mounting, connections, and compartment security. 19. Exhaust system: Check for leaks, damage, and loose mounting. 20. Frame and body: Check frame rails, crossmembers, doors, and other body components. 21. Coupling system: Check fifth wheel or other coupling, locking mechanisms, mounting, and safety devices. 22. Trailer connections: Check air lines, electrical cord, connections, and clearance. 23. Trailer: Check landing gear, frame, doors, suspension, brakes, wheels, tires, and lights. 24. Cargo: Check securement, weight distribution, tiedowns, covers, and required placards. 25. Brake tests: Perform the applicable parking-brake, service-brake, and air-brake or hydraulic-brake checks. Passenger vehicles, tankers, doubles, and other specialized vehicles require additional equipment-specific checks."
