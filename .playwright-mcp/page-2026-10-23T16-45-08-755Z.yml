            - button "The store and fuel prices APIs. These apis give you the Love's location information and fuel price information." [ref=f9e118]
            - article "home" [ref=f9e121]:
              - generic [ref=f9e123]:
                - heading "Love's Store & Fuel Prices APIs" [level=2] [ref=f9e124]
                - paragraph [ref=f9e125]:
                  - text: The purpose of this api is to give clients a way to download the store and fuel price information. This information is comparable to information manually downloadable from
                  - link "https://www.loves.com/en/location-and-fuel-price-search" [ref=f9e126] [cursor=pointer]:
                    - /url: https://www.loves.com/en/location-and-fuel-price-search
                - heading "How Do I Get Access?" [level=3] [ref=f9e127]
                - paragraph [ref=f9e128]:
                  - text: Love's secures our APIs using an
                  - link "OAuth flow" [ref=f9e129] [cursor=pointer]:
                    - /url: https://oauth.net/2/grant-types/client-credentials/
                  - text: . To request access contact your Love's sales representative or click on the "Request Access" button.
                - heading "Routes" [level=3] [ref=f9e130]
                - paragraph [ref=f9e131]: Love's has provided a single route to get all store and fuel price information in a single call. If your needs are different please contact your Love's representative.
                - paragraph [ref=f9e132]: /stores
                - list [ref=f9e133]:
                  - listitem [ref=f9e134]: Retrieve all store and fuel price information
                - paragraph [ref=f9e135]: Example can be viewed by clicking on the "Stores Resource" on the left pane.
                - separator [ref=f9e136]
                - paragraph [ref=f9e137]: Love's has provided a single route to obtain fuel price information for all stores within a single call that is filtered by OLA Product code via a query parameter. If your needs are different please contact your Love's representative.
                - paragraph [ref=f9e138]: /fuelPrices
                - list [ref=f9e139]:
                  - listitem [ref=f9e140]: Retrieve fuel price information for all stores
                - paragraph [ref=f9e141]: "OLA Product Codes are to be passed in to the request as a query parameter and in the format of a comma separated string. Example: 20, 21, 22"
                - paragraph [ref=f9e142]: Example can be viewed by clicking on the "Fuel Pricing Information" on the left pane.
                - heading "Environments" [level=3] [ref=f9e143]
                - paragraph [ref=f9e144]: You can click on the API Instances in the left pane to view what the environment urls are.
