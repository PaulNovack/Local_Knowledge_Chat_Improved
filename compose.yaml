name: local-knowledge-chat
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
  asr-service:
    build:
      context: ./asr-service
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
  piper-service:
    build:
      context: ./piper-service
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
volumes:
  qdrant_data:
  ollama_data:
